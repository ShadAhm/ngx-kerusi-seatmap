<div class="kerusi-legend">
  @if (types().length) {
    <div class="kerusi-legend__block">
      <h4 class="kerusi-legend__heading">{{ headingSeatTypes() }}</h4>
      <ul class="kerusi-legend__list">
        @for (entry of types(); track entry.id) {
          <li class="kerusi-legend__item">
            <span
              class="kerusi-legend__swatch"
              aria-hidden="true"
              [style.background]="swatch(entry)"
              [style.color]="swatchText(entry)"
            ></span>
            <span class="kerusi-legend__label">{{ entry.label }}</span>
            @if (showPrices() && price(entry)) {
              <span class="kerusi-legend__price">{{ price(entry) }}</span>
            }
          </li>
        }
      </ul>
    </div>
  }

  <div class="kerusi-legend__block">
    <h4 class="kerusi-legend__heading">{{ headingAvailability() }}</h4>
    <ul class="kerusi-legend__list">
      @for (status of statuses(); track status.key) {
        <li class="kerusi-legend__item">
          <!-- Shape carries status now, so every swatch draws the seat glyph
               rather than a flat colour — a flat swatch would teach a cue the
               map itself no longer uses. -->
          <svg
            class="kerusi-legend__swatch kerusi-legend__swatch--glyph"
            aria-hidden="true"
            focusable="false"
            [attr.viewBox]="'0 0 ' + glyphSize + ' ' + glyphSize"
          >
            <path [attr.d]="glyphBody" [style.fill]="status.fill" />
            @if (hasWash(status.kind)) {
              <path [attr.d]="glyphBody" [style.fill]="washFillOf(status.kind)" opacity="0.5" />
            }
            @if (status.kind === 'selected') {
              <!-- Two tones, same as the map: the body above is the frame, this
                   is the core inside it. -->
              <path [attr.d]="glyphCore" [style.fill]="coreFill()" />
            }
            @if (hasOccupant(status.kind)) {
              <path
                [attr.d]="occupantPathOf(status.kind)"
                class="kerusi-legend__occupant kerusi-legend__occupant--{{ status.kind }}"
                [attr.stroke-width]="occupantStrokeWidthOf(status.kind)"
                [style.fill]="occupantFillOf(status.kind)"
                [style.stroke]="occupantStrokeOf(status.kind)"
              />
            }
          </svg>
          <span class="kerusi-legend__label">{{ status.label }}</span>
        </li>
      }
    </ul>
  </div>
</div>
