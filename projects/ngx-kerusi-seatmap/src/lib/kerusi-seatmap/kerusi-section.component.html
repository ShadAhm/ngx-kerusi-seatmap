<svg
  xmlns="http://www.w3.org/2000/svg"
  class="kerusi-section-svg"
  role="presentation"
  focusable="false"
  [style.--kerusi-focus-ring-input]="colors().focusRing"
  [attr.viewBox]="viewBox()"
  [style.max-width.px]="naturalWidth()"
  preserveAspectRatio="xMidYMid meet"
>
  <rect
    x="0"
    y="0"
    [attr.width]="layout().width"
    [attr.height]="layout().height"
    [style.fill]="backdrop()"
  />

  <!-- Elements first, so a screen or stage sits behind the seats it faces. -->
  @for (placed of layout().elements; track placed.element.id) {
    <g
      class="kerusi-element kerusi-element--{{ placed.element.kind }}"
      [attr.transform]="transform(placed)"
    >
      @switch (style(placed).shape) {
        @case ('screen') {
          <path [attr.d]="screenPathOf(placed)" [style.fill]="elementFillOf(placed)" />
        }
        @case ('void') {
          <rect
            class="kerusi-element__void"
            [attr.x]="placed.x"
            [attr.y]="placed.y"
            [attr.width]="placed.width"
            [attr.height]="placed.height"
            [style.stroke]="elementTextFillOf(placed)"
            fill="none"
          />
        }
        @default {
          <rect
            [attr.x]="placed.x"
            [attr.y]="placed.y"
            [attr.width]="placed.width"
            [attr.height]="placed.height"
            [attr.rx]="radiusOf(placed)"
            [style.fill]="elementFillOf(placed)"
          />
        }
      }
      @if (placed.element.label && style(placed).showLabel) {
        <text
          class="kerusi-element__label"
          text-anchor="middle"
          dominant-baseline="central"
          [attr.x]="placed.centerX"
          [attr.y]="placed.centerY"
          [attr.font-size]="placed.fontSize"
          [style.fill]="elementTextFillOf(placed)"
          [attr.transform]="counterRotate(placed)"
        >
          {{ placed.element.label }}
        </text>
      }
    </g>
  }

  @for (placed of layout().seats; track placed.seat.id) {
    <g
      [class]="seatClasses(placed)"
      role="button"
      [attr.tabindex]="tabIndex(placed)"
      [attr.aria-label]="ariaLabel(placed)"
      [attr.aria-pressed]="isSelected(placed)"
      [attr.aria-disabled]="!placed.seat.selectable"
      [attr.data-seat-id]="placed.seat.id"
      [attr.transform]="transform(placed)"
      (click)="onSeatClick(placed)"
      (focus)="onSeatFocus(placed)"
      (keydown)="onKeydown($event)"
    >
      @let variant = occupantVariant(placed);
      <!-- Tapered toward the back, square at the front, so which way the seat
           faces is legible from the outline alone. -->
      <path class="kerusi-seat__box" [attr.d]="bodyPath(placed)" [style.fill]="fill(placed)" />
      @if (variant === 'held' || variant === 'booked') {
        <!-- Colour stays the seat type's; a taken seat recedes under a wash
             instead, so the type colour still reads on a busy map. -->
        <path
          class="kerusi-seat__wash"
          [attr.d]="bodyPath(placed)"
          [style.fill]="washFill(placed)"
        />
      }
      @if (variant === 'selected') {
        <!-- Selection must survive the colours being rethemed: a ring and a
             silhouette say "picked" even when selectedBg is overridden. -->
        <path
          class="kerusi-seat__ring"
          [attr.d]="ringPath(placed)"
          fill="none"
          [attr.stroke-width]="ringStroke(placed)"
          [style.stroke]="textFill(placed)"
        />
      }
      @if (variant) {
        <!-- Deliberately not counter-rotated: the occupant leans with the
             seat. Solid = settled (yours, or sold); hollow = a hold still in
             progress. -->
        <path
          class="kerusi-seat__occupant kerusi-seat__occupant--{{ variant }}"
          [attr.d]="occupantPath(placed)"
          [attr.stroke-width]="occupantStroke(placed)"
          [style.fill]="occupantFill(variant)"
          [style.stroke]="occupantStrokeColor(variant)"
        />
      }
      <text
        class="kerusi-seat__label"
        text-anchor="middle"
        dominant-baseline="central"
        [attr.x]="placed.centerX"
        [attr.y]="placed.centerY"
        [attr.font-size]="placed.fontSize"
        [style.fill]="textFill(placed)"
        [attr.transform]="counterRotate(placed)"
      >
        {{ placed.seat.label }}
      </text>
      @if (placed.seat.accessibility?.wheelchairAccessible) {
        <!-- A corner marker, not a different fill: availability owns the fill. -->
        <circle
          class="kerusi-seat__wheelchair"
          [attr.cx]="placed.x + placed.width * 0.82"
          [attr.cy]="placed.y + placed.height * 0.18"
          [attr.r]="placed.width * 0.13"
          [style.fill]="textFill(placed)"
        />
      }
    </g>
  }
</svg>
